openapi: 3.0.0
info:
  title: Users API
  version: 1.0.0
  description: API for managing users

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "640f0dc5e4c123001f9a12ab"
        firstName:
          type: string
          example: Alex
        lastName:
          type: string
          example: Smith
        email:
          type: string
          example: alex@mail.com
        role:
          type: string
          example: user
        status:
          type: string
          example: active

    UsersListResponse:
      type: array
      items:
        $ref: "#/components/schemas/User"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Forbidden"

paths:
  /users:
    get:
      summary: Get list of users
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            example: 0
        - in: query
          name: limit
          schema:
            type: integer
            example: 10
        - in: query
          name: sort
          schema:
            type: string
            example: "createdAt:desc"
        - in: query
          name: match
          schema:
            type: string
            example: '{"role":"user"}'
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      summary: Get user by ID
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "640f0dc5e4c123001f9a12ab"
        - in: query
          name: role
          schema:
            type: string
            example: user
      responses:
        "200":
          description: User object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update user (self only)
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "640f0dc5e4c123001f9a12ab"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: Alex
                lastName:
                  type: string
                  example: Smith
                email:
                  type: string
                  example: alex@mail.com
      responses:
        "204":
          description: User updated successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden (cannot update other users)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete user
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "640f0dc5e4c123001f9a12ab"
      responses:
        "204":
          description: User deleted successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/status:
    patch:
      summary: Update user status
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "640f0dc5e4c123001f9a12ab"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: inactive
      responses:
        "204":
          description: Status updated successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
